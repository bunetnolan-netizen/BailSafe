<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C2B29"/>
      <stop offset="100%" stop-color="#152220"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8D07A"/>
      <stop offset="40%" stop-color="#C9A94A"/>
      <stop offset="100%" stop-color="#8A6D22"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0DF9A"/>
      <stop offset="100%" stop-color="#C9A94A"/>
    </linearGradient>
    <linearGradient id="lensGlass" x1="0.2" y1="0.2" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="rgba(201,169,74,0.10)"/>
      <stop offset="50%" stop-color="rgba(201,169,74,0.03)"/>
      <stop offset="100%" stop-color="rgba(201,169,74,0.08)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="18" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern (forensic/tech feel) -->
  <g opacity="0.04" stroke="white" stroke-width="0.3">
    <line x1="0" y1="40" x2="200" y2="40"/><line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="120" x2="200" y2="120"/><line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="40" y1="0" x2="40" y2="200"/><line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/><line x1="160" y1="0" x2="160" y2="200"/>
  </g>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.15"/>
  
  <!-- Shield -->
  <g transform="translate(100, 100)">
    <!-- Shadow -->
    <path d="M0 -70 L58 -50 C60 -50 62 -48 62 -46 L62 28 C62 64 38 80 0 90 C-38 80 -62 64 -62 28 L-62 -46 C-62 -48 -60 -50 -58 -50 Z" 
          fill="rgba(0,0,0,0.3)" transform="translate(2, 2)"/>
    
    <!-- Shield body -->
    <path d="M0 -70 L58 -50 C60 -50 62 -48 62 -46 L62 28 C62 64 38 80 0 90 C-38 80 -62 64 -62 28 L-62 -46 C-62 -48 -60 -50 -58 -50 Z" 
          fill="#1C2B29" stroke="url(#gold)" stroke-width="2.5"/>
    
    <!-- Inner border -->
    <path d="M0 -62 L52 -44 L52 28 C52 58 32 72 0 80 C-32 72 -52 58 -52 28 L-52 -44 Z" 
          fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.35"/>
    
    <!-- Top accent lines -->
    <line x1="-30" y1="-52" x2="30" y2="-52" stroke="url(#gold)" stroke-width="1" opacity="0.25"/>
    <line x1="-20" y1="-44" x2="20" y2="-44" stroke="url(#gold)" stroke-width="0.6" opacity="0.15"/>
    
    <!-- ===== MAGNIFYING GLASS ===== -->
    <g transform="translate(0, -19)">
      <!-- Handle -->
      <line x1="32" y1="35" x2="54" y2="58" stroke="#8A6D22" stroke-width="6" stroke-linecap="round"/>
      <line x1="32" y1="35" x2="54" y2="58" stroke="#C9A94A" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="35" x2="54" y2="58" stroke="#E8D07A" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
      
      <!-- Lens outer -->
      <circle cx="0" cy="0" r="36" fill="#1C2B29" stroke="#8A6D22" stroke-width="5"/>
      <circle cx="0" cy="0" r="36" fill="none" stroke="#C9A94A" stroke-width="3"/>
      <circle cx="0" cy="0" r="36" fill="none" stroke="#E8D07A" stroke-width="1" opacity="0.6"/>
      
      <!-- Lens glass -->
      <circle cx="0" cy="0" r="33" fill="url(#lensGlass)"/>
      
      <!-- Reflection (upper-left arc) -->
      <path d="M-20 -22 A30 30 0 0 1 20 -20" fill="none" stroke="white" stroke-width="2.5" opacity="0.12" stroke-linecap="round"/>
      <path d="M-22 -16 A28 28 0 0 1 16 -14" fill="none" stroke="white" stroke-width="1" opacity="0.08" stroke-linecap="round"/>
      
      <!-- ===== DOCUMENT INSIDE LENS ===== -->
      <g transform="translate(0, 4)">
        <!-- Folder body -->
        <path d="M-15 -6 L-15 14 L15 14 L15 -6 L-5 -6 L-1 -1 L-15 -1 Z" 
              fill="#1C2B29" stroke="#E8D07A" stroke-width="1.2" stroke-linejoin="round"/>
        <!-- Folder tab -->
        <path d="M-15 -6 L-5 -6 L-1 -1 L-15 -1" fill="#C9A94A" stroke="#E8D07A" stroke-width="0.8" stroke-linejoin="round" opacity="0.9"/>
        <!-- Document lines -->
        <line x1="-11" y1="2" x2="11" y2="2" stroke="#C9A94A" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/>
        <line x1="-11" y1="6" x2="8" y2="6" stroke="#C9A94A" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
        <line x1="-11" y1="10" x2="5" y2="10" stroke="#C9A94A" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  
  <!-- Bottom gold accent bar -->
  <rect x="60" y="186" width="80" height="1.5" rx="0.75" fill="url(#gold)" opacity="0.3"/>
</svg>
